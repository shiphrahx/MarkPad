# Settings only. MarkPad is one package, not a monorepo.

overrides:
  # Mermaid asks for KaTeX 0.16, which has a prototype pollution advisory
  # fixed in 0.18.2. The app already ships 0.18 for its own maths, so this
  # also stops two copies of KaTeX ending up in the bundle.
  katex@<0.18.2: ^0.18.4
