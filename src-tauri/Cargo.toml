[package]
name = "markpad"
version = "0.1.3"
description = "A Markdown editor for Windows and macOS."
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[lib]
name = "markpad_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset is what lets the webview read an image off disk. Without it
# every picture in every Markdown file is a broken image.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

# Two Win32 jobs Tauri does not cover: a message box before any window exists,
# for the WebView2 check, and colouring the real window caption so the chrome
# can match the design without faking a title bar.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
# The installer budget is 8 MB. Optimising for size, throwing away panic
# unwinding and letting LTO run across the whole crate graph is most of how a
# Rust binary gets small.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
