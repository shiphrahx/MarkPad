[package]
name = "markpad"
version = "0.1.4"
description = "A Markdown editor for Windows, macOS and Linux."
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[lib]
name = "markpad_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Opens a document's links in the browser. The page gets no permission to use
# it directly: links go through our own command, which only allows http(s)
# and mailto.
tauri-plugin-opener = "=2.5.5"
serde = { version = "1", features = ["derive"] }
# Already in the tree through Tauri. The session file is the only JSON we write.
serde_json = "1"
# Already in the tree through Tauri. Decodes the image protocol's URLs.
percent-encoding = "2"
thiserror = "2"

# Two Win32 jobs Tauri does not cover: a message box before any window exists,
# for the WebView2 check, and colouring the real window caption so the chrome
# can match the design without faking a title bar.
# A second launch hands its files to the window that's already open, rather
# than starting a second copy that restores the same tabs and saves over them.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
# The installer budget is 8 MB. Optimising for size, throwing away panic
# unwinding and letting LTO run across the whole crate graph is most of how a
# Rust binary gets small.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
