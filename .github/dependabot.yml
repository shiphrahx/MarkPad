# Weekly, grouped, so it's one PR per ecosystem rather than one per package.
# Security updates still arrive as soon as an advisory lands, whatever this
# says.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '@tauri-apps/*'
      # mermaid 12 needs Safari 17.4 and we still support macOS 13, which
      # ships with Safari 16. Diagrams would stop drawing there.
      - dependency-name: mermaid
        update-types: ['version-update:semver-major']
      # prosemirror-markdown still pins markdown-it 14, so 15 would mean two
      # copies of the parser (see 0005). 15 also drops fuzzy linkify.
      - dependency-name: markdown-it
        update-types: ['version-update:semver-major']
    groups:
      npm:
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    # Held back on purpose. See the comment on tauri-plugin-opener in Cargo.toml.
    ignore:
      - dependency-name: tauri
      - dependency-name: tauri-*
      - dependency-name: wry
      - dependency-name: tao
    groups:
      cargo:
        patterns: ['*']

  # The actions are pinned to commits, so this is the only thing that moves
  # them on.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
