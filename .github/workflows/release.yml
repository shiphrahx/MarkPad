name: Release

# Builds the actual installers and attaches them to the tag's release.
# Without this, a release only carries GitHub's source archives, which nobody
# can install from.

on:
  push:
    tags: ['v*']
  # So an existing tag can be filled in after the fact, or a failed upload retried.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and upload to, e.g. v0.1.0'
        required: true

# Read-only by default. Each job asks for what it needs below.
permissions:
  contents: read

jobs:
  # Pushing a tag creates a tag. It does not create a release, and there is
  # nothing for the installers to attach themselves to until one exists. Its
  # own job rather than a step in each matrix leg, so four runners don't race
  # each other to create the same thing.
  entry:
    name: Release entry
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Make sure the release exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "$TAG already has a release, leaving its notes alone."
          else
            gh release create "$TAG" --repo "$REPO"               --title "MarkPad ${TAG#v}" --generate-notes
          fi

  installers:
    name: ${{ matrix.name }}
    needs: entry
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      # For the provenance attestation: a signed statement, tied to this
      # workflow run, of exactly which bytes it built.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # One dmg per chip rather than a universal build. The universal one
          # worked, but it carries both binaries and ate 7.15 of the 8 MB
          # budget, which left nothing for the app to grow into.
          - os: macos-latest
            name: macOS (Apple silicon)
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
            pattern: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - os: macos-latest
            name: macOS (Intel)
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
            pattern: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            name: Windows (x64)
            args: ''
            rust-targets: ''
            pattern: src-tauri/target/release/bundle/nsis/*-setup.exe
          # 22.04 rather than latest on purpose. The binary links against the
          # build machine's glibc, and that sets the floor for who can install
          # it. Building on a newer runner would quietly drop distributions
          # people are still on.
          - os: ubuntu-22.04
            name: Linux (x64)
            args: ''
            rust-targets: ''
            pattern: >-
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: ./.github/actions/linux-webview

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.rust-targets }}

      # Tagging doesn't touch package.json, so it's entirely possible to tag
      # v0.1.2 and ship three files called MarkPad_0.1.1. Cheaper to stop here
      # than to work out later which build a bug report is actually about.
      - name: Check the tag against the declared version
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          declared=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$declared" ]; then
            echo "Tag $TAG does not match package.json, which says $declared."
            echo "Bump the version and move the tag, or tag v$declared."
            exit 1
          fi
          echo "$TAG matches the declared version."

      - run: pnpm install --frozen-lockfile
      - run: pnpm icons

      - run: pnpm tauri build ${{ matrix.args }}

      # The size budget applies to what people actually download, not only to
      # the CI build, so it is checked here too.
      - name: Check the installer against the 8 MB budget
        shell: bash
        # Unquoted: the Linux leg passes two globs, one per package format.
        run: node scripts/check-budget.mjs ${{ matrix.pattern }}

      # Nothing is code signed, so these are how anybody can check that the
      # file they downloaded is the file this workflow built.
      - name: Write a checksum next to each installer
        id: checksums
        shell: bash
        run: |
          {
            echo 'files<<END'
            for file in ${{ matrix.pattern }}; do
              name=$(basename "$file")
              if command -v sha256sum >/dev/null; then
                (cd "$(dirname "$file")" && sha256sum "$name" > "$name.sha256")
              else
                (cd "$(dirname "$file")" && shasum -a 256 "$name" > "$name.sha256")
              fi
              echo "$file"
            done
            echo 'END'
          } >> "$GITHUB_OUTPUT"

      - name: Attest where the installer came from
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ steps.checksums.outputs.files }}

      - name: Attach the installer and its checksum to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          for file in ${{ matrix.pattern }}; do
            gh release upload "$TAG" "$file" "$file.sha256" --clobber --repo "$REPO"
          done
