name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repo, so the token can't either.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Reported rather than enforced: shared runners are too noisy to fail a
      # build on a timing. A change that makes these several times slower is
      # still obvious in the log.
      - run: pnpm bench

  rust:
    name: Rust
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The file writing code is the part that behaves differently per
        # platform, so its tests run on all three rather than on whichever
        # runner was cheapest. The permissions and symlink tests only exist on
        # the Unix legs; the locking retry only means anything on Windows.
        #
        # 22.04 rather than latest, to match the runner the release builds on.
        # The binary links against the build machine's glibc, so testing on a
        # newer one would be testing something nobody can install.
        os: [windows-latest, macos-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/linux-webview

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      # The icons aren't committed, and tauri-build reads them at compile time,
      # so anything that compiles the crate has to generate them first.
      - run: pnpm install --frozen-lockfile
      - run: pnpm icons

      - run: cargo fmt --all --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

  budgets:
    name: Installer size
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            pattern: src-tauri/target/release/bundle/nsis/*-setup.exe
          - os: macos-latest
            bundle: dmg
            pattern: src-tauri/target/release/bundle/dmg/*.dmg
          # Two legs rather than one building both, so every entry in this
          # matrix stays one bundle and one glob. The second compile is almost
          # entirely cache.
          - os: ubuntu-22.04
            bundle: deb
            pattern: src-tauri/target/release/bundle/deb/*.deb
          - os: ubuntu-22.04
            bundle: rpm
            pattern: src-tauri/target/release/bundle/rpm/*.rpm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/linux-webview
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm icons
      - run: pnpm tauri build --bundles ${{ matrix.bundle }}

      # The budget is pass/fail. If a change breaks it, the change is wrong.
      - name: Check the installer against the 8 MB budget
        shell: bash
        run: node scripts/check-budget.mjs "${{ matrix.pattern }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.pattern }}

  # The one job that presses keys.
  #
  # Cut, copy and paste go through the GTK menu rather than through the webview,
  # and PDF export is window.print() in an iframe. Neither can be checked by a
  # unit test, and neither has a fallback if it turns out not to work, so this
  # launches a real window on a real X server and drives it with xdotool.
  smoke:
    name: Linux smoke test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/linux-webview
        with:
          extra: xvfb xdotool xclip openbox imagemagick

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm icons

      # Debug and unbundled. Nothing here cares how big the binary is or how
      # fast it runs, and a debug build compiles in a fraction of the time.
      - run: pnpm tauri build --debug --no-bundle

      - name: Type into a real window
        run: scripts/linux-smoke.sh

      # The script screenshots the display itself, on the way out and before
      # its own trap tears the X server down. A blank window and a window that
      # ignored a keystroke look identical in a log.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: smoke-failure
          path: smoke-failure.png
          if-no-files-found: ignore
