name: CodeQL

# Static analysis of the TypeScript and of the workflows themselves. Free on
# a public repo, and findings land in the Security tab.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 3'

permissions:
  contents: read

jobs:
  analyse:
    name: Analyse ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:${{ matrix.language }}
