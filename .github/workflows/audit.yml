name: Audit

# Known vulnerabilities in what we ship. On every change to a lockfile, and
# weekly, because an advisory can land against a dependency nobody touched.

on:
  push:
    branches: [main]
    paths: ['pnpm-lock.yaml', 'src-tauri/Cargo.lock', '.github/workflows/audit.yml']
  pull_request:
    paths: ['pnpm-lock.yaml', 'src-tauri/Cargo.lock', '.github/workflows/audit.yml']
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    name: npm packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Production dependencies only: those are the ones in the installer.
      - run: pnpm audit --prod --audit-level high

  cargo:
    name: Rust crates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # So a finding shows up as an issue rather than only in a log.
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ github.token }}
          working-directory: src-tauri
