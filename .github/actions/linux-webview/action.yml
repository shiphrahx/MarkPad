name: Linux webview
description: >
  Install what Tauri needs to build against WebKitGTK. Does nothing on the
  Windows and macOS runners, so every job can call it without a condition of
  its own.

inputs:
  extra:
    description: Further packages, space separated. Used by the smoke test.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libxdo-dev \
          libssl-dev \
          patchelf \
          ${{ inputs.extra }}
